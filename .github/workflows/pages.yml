# Publica el lab en GitHub Pages: https://farena.github.io/fa-editor/
#
# Requiere, una sola vez, Settings > Pages > Build and deployment > Source:
# "GitHub Actions". Sin eso el deploy falla aunque el workflow corra.
name: Deploy lab to Pages

on:
  push:
    branches: ['main']
  # Para poder dispararlo a mano desde la pestaña Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez; si entra uno nuevo, el anterior se cancela.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build lab
        run: npm run build:lab

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist-lab'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
