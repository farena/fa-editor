# Publica el lab en GitHub Pages: https://farena.github.io/fa-editor/
#
# `enablement: true` en configure-pages deja Pages en modo "GitHub Actions" por
# API, asi que no hace falta tocar Settings > Pages a mano.
name: Deploy lab to Pages

on:
  push:
    branches: ['main']
  # Para poder dispararlo a mano desde la pestaña Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez; si entra uno nuevo, el anterior se cancela.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build lab
        run: npm run build:lab

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist-lab'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
